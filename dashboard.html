<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aula Virtual — Preu CP</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          institucional: { 900: '#0F172A', 800: '#1E293B', 700: '#334155' },
          acento: { DEFAULT: '#1D4ED8', dark: '#1E3A8A' }
        },
        animation: {
          'fade-in': 'fadeIn 0.3s ease-in-out',
        },
        keyframes: {
          fadeIn: {
            '0%': { opacity: '0', transform: 'translateY(10px)' },
            '100%': { opacity: '1', transform: 'translateY(0)' },
          }
        }
      }
    }
  }
</script>
</head>
<body class="bg-slate-50 text-institucional-900 antialiased font-sans">

  <!-- NAVBAR SUPERIOR -->
  <header class="bg-institucional-900 sticky top-0 z-40 shadow-md">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 flex items-center justify-between h-16">
      <div class="flex items-center gap-3">
        <div class="w-8 h-8 rounded-lg bg-acento flex items-center justify-center text-white font-bold text-sm shadow-inner">CP</div>
        <span class="text-white font-semibold hidden sm:block">Aula Virtual</span>
      </div>
      <!-- Navegación Principal -->
      <nav class="flex items-center gap-1 sm:gap-2 text-sm font-medium overflow-x-auto no-scrollbar">
        <button class="text-slate-300 hover:text-white hover:bg-white/10 px-3 py-2 rounded-lg transition-colors whitespace-nowrap">Inicio</button>
        <button class="text-white bg-white/15 px-3 py-2 rounded-lg shadow-sm whitespace-nowrap">Mis cursos</button>
        <button class="text-slate-300 hover:text-white hover:bg-white/10 px-3 py-2 rounded-lg transition-colors hidden md:block">Calendario</button>
      </nav>
      <!-- Perfil -->
      <div class="w-9 h-9 rounded-full bg-slate-700 border-2 border-slate-600 flex items-center justify-center text-white text-sm font-bold cursor-pointer hover:border-acento transition-colors">
        JC
      </div>
    </div>
  </header>

  <div class="max-w-7xl mx-auto px-4 sm:px-6 py-8 flex flex-col lg:flex-row gap-8">

    <!-- SIDEBAR (Perfil e Info) -->
    <aside class="w-full lg:w-64 shrink-0">
      <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 sticky top-24">
        <div class="text-center mb-6">
          <div class="w-20 h-20 mx-auto rounded-full bg-gradient-to-tr from-acento to-blue-400 p-1 mb-3 shadow-md">
            <div class="w-full h-full bg-white rounded-full flex items-center justify-center text-2xl font-bold text-slate-700">JC</div>
          </div>
          <h2 class="font-bold text-lg">Javier Contreras</h2>
          <p class="text-sm text-acento font-medium">Generación 2026</p>
        </div>
        <div class="h-px w-full bg-slate-100 mb-4"></div>
        <nav class="space-y-1.5 text-sm">
          <a href="#" class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-slate-600 hover:bg-blue-50 hover:text-acento font-semibold transition-colors">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
            Mi Perfil
          </a>
          <a href="#" class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-slate-600 hover:bg-blue-50 hover:text-acento font-semibold transition-colors">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
            Mensajes <span class="ml-auto bg-red-500 text-white text-[10px] font-bold px-2 py-0.5 rounded-full">3</span>
          </a>
        </nav>
      </div>
    </aside>

    <!-- AREA PRINCIPAL -->
    <main class="flex-1 min-w-0">

      <!-- VISTA 1: LISTA DE CURSOS -->
      <section id="vista-cursos" class="animate-fade-in">
        <div class="mb-6">
          <h1 class="text-2xl sm:text-3xl font-bold tracking-tight text-slate-800">Mis cursos activos</h1>
          <p class="text-sm text-slate-500 mt-1">Selecciona una materia para ingresar al aula.</p>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <!-- Tarjeta curso M1 -->
          <button onclick="abrirCurso('Matemática M1', 'Prof. Andrea Muñoz', 'M1', 72)" class="text-left bg-white rounded-2xl border border-slate-200 shadow-sm hover:shadow-md hover:border-blue-300 transform hover:-translate-y-1 transition-all duration-200 p-5 group">
            <div class="flex items-start justify-between mb-4">
              <div class="w-12 h-12 rounded-xl bg-blue-100 text-acento flex items-center justify-center font-black text-xl group-hover:bg-acento group-hover:text-white transition-colors">M1</div>
              <span class="bg-green-100 text-green-700 text-xs font-bold px-2.5 py-1 rounded-md">En curso</span>
            </div>
            <h3 class="font-bold text-lg mb-1">Matemática M1</h3>
            <p class="text-sm text-slate-500 font-medium mb-4">Prof. Andrea Muñoz</p>
            <div class="w-full bg-slate-100 rounded-full h-2">
              <div class="bg-acento h-2 rounded-full" style="width:72%"></div>
            </div>
            <div class="text-right mt-2"><span class="text-xs font-bold text-slate-400">Progreso: 72%</span></div>
          </button>

          <!-- Tarjeta curso M2 -->
          <button onclick="abrirCurso('Matemática M2', 'Prof. Andrea Muñoz', 'M2', 45)" class="text-left bg-white rounded-2xl border border-slate-200 shadow-sm hover:shadow-md hover:border-blue-300 transform hover:-translate-y-1 transition-all duration-200 p-5 group">
            <div class="flex items-start justify-between mb-4">
              <div class="w-12 h-12 rounded-xl bg-blue-100 text-acento flex items-center justify-center font-black text-xl group-hover:bg-acento group-hover:text-white transition-colors">M2</div>
              <span class="bg-green-100 text-green-700 text-xs font-bold px-2.5 py-1 rounded-md">En curso</span>
            </div>
            <h3 class="font-bold text-lg mb-1">Matemática M2</h3>
            <p class="text-sm text-slate-500 font-medium mb-4">Prof. Andrea Muñoz</p>
            <div class="w-full bg-slate-100 rounded-full h-2">
              <div class="bg-acento h-2 rounded-full" style="width:45%"></div>
            </div>
            <div class="text-right mt-2"><span class="text-xs font-bold text-slate-400">Progreso: 45%</span></div>
          </button>
          
          <!-- Tarjeta curso Química -->
          <button onclick="abrirCurso('Química', 'Prof. Ignacio Rojas', 'Q', 30)" class="text-left bg-white rounded-2xl border border-slate-200 shadow-sm hover:shadow-md hover:border-blue-300 transform hover:-translate-y-1 transition-all duration-200 p-5 group">
            <div class="flex items-start justify-between mb-4">
              <div class="w-12 h-12 rounded-xl bg-blue-100 text-acento flex items-center justify-center font-black text-xl group-hover:bg-acento group-hover:text-white transition-colors">Q</div>
              <span class="bg-green-100 text-green-700 text-xs font-bold px-2.5 py-1 rounded-md">En curso</span>
            </div>
            <h3 class="font-bold text-lg mb-1">Química</h3>
            <p class="text-sm text-slate-500 font-medium mb-4">Prof. Ignacio Rojas</p>
            <div class="w-full bg-slate-100 rounded-full h-2">
              <div class="bg-acento h-2 rounded-full" style="width:30%"></div>
            </div>
            <div class="text-right mt-2"><span class="text-xs font-bold text-slate-400">Progreso: 30%</span></div>
          </button>
        </div>
      </section>

      <!-- VISTA 2: INTERIOR DE CURSO -->
      <section id="vista-curso" class="hidden">
        <button onclick="volverCursos()" class="text-sm font-semibold text-slate-500 hover:text-acento mb-6 flex items-center gap-2 bg-white px-4 py-2 rounded-lg border border-slate-200 shadow-sm w-fit transition-colors">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
          Volver a Mis cursos
        </button>
        
        <div class="bg-institucional-900 rounded-2xl p-6 sm:p-8 mb-8 text-white flex items-center gap-5 shadow-lg relative overflow-hidden">
          <div class="absolute top-0 right-0 opacity-10 pointer-events-none">
            <svg width="200" height="200" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
          </div>
          <div class="w-16 h-16 rounded-2xl bg-white/20 backdrop-blur text-white flex items-center justify-center font-black text-2xl border border-white/30" id="curso-icono"></div>
          <div class="z-10">
            <h1 class="text-2xl sm:text-3xl font-bold tracking-tight mb-1" id="curso-titulo"></h1>
            <p class="text-blue-200 font-medium" id="curso-profesor"></p>
          </div>
        </div>

        <div class="grid grid-cols-2 sm:grid-cols-4 gap-4 sm:gap-6">
          <a href="#" class="aspect-square bg-white rounded-2xl border border-slate-200 shadow-sm hover:shadow-lg hover:border-blue-300 transform hover:-translate-y-1 transition-all flex flex-col items-center justify-center gap-4 p-4 group">
            <div class="w-14 h-14 rounded-full bg-slate-50 text-institucional-900 flex items-center justify-center text-2xl group-hover:bg-blue-50 group-hover:text-acento transition-colors">📄</div>
            <span class="font-bold text-sm text-center text-slate-700">Documentos</span>
          </a>
          <a href="#" class="aspect-square bg-white rounded-2xl border border-slate-200 shadow-sm hover:shadow-lg hover:border-blue-300 transform hover:-translate-y-1 transition-all flex flex-col items-center justify-center gap-4 p-4 group">
            <div class="w-14 h-14 rounded-full bg-slate-50 text-institucional-900 flex items-center justify-center text-2xl group-hover:bg-blue-50 group-hover:text-acento transition-colors">✏️</div>
            <span class="font-bold text-sm text-center text-slate-700">Ejercicios</span>
          </a>
          <a href="#" class="aspect-square bg-white rounded-2xl border border-blue-200 shadow-md hover:shadow-lg hover:border-blue-400 transform hover:-translate-y-1 transition-all flex flex-col items-center justify-center gap-4 p-4 group bg-blue-50 relative overflow-hidden">
            <div class="absolute top-2 right-2 flex h-3 w-3"><span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-red-400 opacity-75"></span><span class="relative inline-flex rounded-full h-3 w-3 bg-red-500"></span></div>
            <div class="w-14 h-14 rounded-full bg-acento text-white flex items-center justify-center text-2xl shadow-inner">🎥</div>
            <span class="font-bold text-sm text-center text-acento">Clase en Vivo</span>
          </a>
          <a href="#" class="aspect-square bg-white rounded-2xl border border-slate-200 shadow-sm hover:shadow-lg hover:border-blue-300 transform hover:-translate-y-1 transition-all flex flex-col items-center justify-center gap-4 p-4 group">
            <div class="w-14 h-14 rounded-full bg-slate-50 text-institucional-900 flex items-center justify-center text-2xl group-hover:bg-blue-50 group-hover:text-acento transition-colors">📢</div>
            <span class="font-bold text-sm text-center text-slate-700">Avisos</span>
          </a>
        </div>
      </section>

    </main>
  </div>

  <script>
    function abrirCurso(nombre, profe, icono, progreso) {
      document.getElementById('curso-titulo').textContent = nombre;
      document.getElementById('curso-icono').textContent = icono;
      document.getElementById('curso-profesor').textContent = profe;
      
      const vCursos = document.getElementById('vista-cursos');
      const vCurso = document.getElementById('vista-curso');
      
      vCursos.classList.add('hidden');
      vCursos.classList.remove('animate-fade-in');
      
      vCurso.classList.remove('hidden');
      vCurso.classList.add('animate-fade-in');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function volverCursos() {
      const vCursos = document.getElementById('vista-cursos');
      const vCurso = document.getElementById('vista-curso');
      
      vCurso.classList.add('hidden');
      vCurso.classList.remove('animate-fade-in');
      
      vCursos.classList.remove('hidden');
      vCursos.classList.add('animate-fade-in');
    }
  </script>
</body>
</html>
