<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aula Virtual — Red Preu UDP</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: { 
        extend: { 
            colors: { 
                /* Colorimetría institucional basada en el rojo UDP */
                institucional: { 
                    900: '#7B1113', /* Rojo oscuro principal */
                    800: '#991B1E', 
                    700: '#B92B27'
                }, 
                acento: { DEFAULT: '#7B1113' } 
            }, 
            animation: { 'fade-in': 'fadeIn 0.3s ease-in-out' }, 
            keyframes: { fadeIn: { '0%': { opacity: '0', transform: 'translateY(10px)' }, '100%': { opacity: '1', transform: 'translateY(0)' } } } 
        } 
    }
  }
</script>
</head>
<body class="bg-slate-100 text-slate-900 antialiased font-sans relative min-h-screen">

  <!-- FONDO DE LA UNIVERSIDAD -->
  <!-- 📌 INSTRUCCIÓN PARA TI: Guarda tu foto de la biblioteca o campus en la carpeta 'images' con el nombre 'fondo-universidad.jpg' -->
  <div class="fixed inset-0 z-[-1]">
    <img src="images/fondo-universidad.jpg" alt="Fondo Campus UDP" class="w-full h-full object-cover opacity-30 grayscale mix-blend-multiply">
  </div>

  <!-- NAVBAR CON LOGOS Y ALIANZAS -->
  <header class="bg-institucional-900 sticky top-0 z-40 shadow-md border-b border-institucional-800">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 flex items-center justify-between h-16">
      
      <!-- LOGO PRINCIPAL -->
      <div class="flex items-center gap-3">
        <!-- 📌 INSTRUCCIÓN PARA TI: Guarda el logo blanco de la UDP en 'images' con el nombre 'logo-udp-blanco.png' -->
        <img src="images/logo-udp-blanco.png" alt="Logo UDP" class="h-12 object-contain">
        <div class="h-6 w-px bg-white/30 hidden sm:block"></div>
        <span class="text-white font-semibold hidden sm:block tracking-wide">Red Preu UDP</span>
      </div>

      <!-- ZONA DE LOGOS INSTITUCIONALES (InspiraTU, Resumen) -->
      <div class="hidden md:flex items-center gap-4 bg-black/20 px-4 py-1.5 rounded-full border border-white/10 backdrop-blur-sm">
         <span class="text-xs text-white/70 font-medium mr-2">En alianza con:</span>
         
         <!-- 📌 INSTRUCCIÓN PARA TI: Guarda el logo de InspiraTU en 'images' como 'logo-inspiratu.png' -->
         <img src="images/logo-inspiratu.png" alt="InspiraTU" class="h-12 object-contain opacity-90 hover:opacity-100 transition-opacity">
         
         <!-- 📌 INSTRUCCIÓN PARA TI: Guarda el logo de Resumen en 'images' como 'logo-resumen.png' -->
         <img src="images/logo-resumen.png" alt="Resumen" class="h-12 object-contain opacity-90 hover:opacity-100 transition-opacity">
      </div>

      <!-- INICIALES USUARIO -->
      <div class="w-9 h-9 rounded-full bg-institucional-800 border-2 border-white/20 flex items-center justify-center text-white text-sm font-bold cursor-pointer user-initials hover:bg-institucional-700 transition-colors shadow-inner">--</div>
    </div>
  </header>

  <div class="max-w-7xl mx-auto px-4 sm:px-6 py-8 flex flex-col lg:flex-row gap-8 relative z-10">
    
    <!-- SIDEBAR PERFIL -->
    <aside class="w-full lg:w-72 shrink-0">
      <div class="bg-white/95 backdrop-blur-md rounded-3xl shadow-lg border border-white/50 p-8 sticky top-24">
        <div class="text-center mb-6">
          <div class="w-28 h-28 mx-auto rounded-full bg-slate-100 border-4 border-white shadow-md p-1 mb-4 flex items-center justify-center">
            <div class="w-full h-full bg-institucional-900/5 rounded-full flex items-center justify-center text-4xl font-black text-institucional-900 user-initials">--</div>
          </div>
          <h2 class="font-bold text-xl text-slate-800" id="user-name">Cargando...</h2>
          <p class="text-sm font-bold text-institucional-900 mt-1">Red Preu UDP</p>
          <p class="text-xs text-slate-400 mt-1">Generación 2026</p>
        </div>
        <div class="w-full h-px bg-slate-200 my-6"></div>
        <button onclick="cerrarSesion()" class="w-full text-center text-sm text-institucional-900 hover:text-white hover:bg-institucional-900 py-3 rounded-xl font-bold transition-all border border-institucional-900/20">Cerrar Sesión</button>
      </div>
    </aside>

    <!-- MAIN AREA -->
    <main class="flex-1 min-w-0">
      
      <!-- VISTA 1: LISTA DE CURSOS DINÁMICA -->
      <section id="vista-cursos" class="animate-fade-in">
        <div class="mb-6 flex justify-between items-end bg-white/80 backdrop-blur-sm p-4 rounded-2xl shadow-sm border border-white">
          <div>
            <h1 class="text-2xl font-bold text-slate-800">Mis ramos activos</h1>
            <p class="text-sm text-slate-500 mt-1">Selecciona una materia para continuar tu preparación.</p>
          </div>
        </div>
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6" id="cursos-container"></div>
      </section>

      <!-- VISTA 2: INTERIOR DEL CURSO -->
      <section id="vista-curso" class="hidden">
        
        <button onclick="volverCursos()" class="text-sm font-semibold text-slate-600 hover:text-institucional-900 mb-6 flex items-center gap-2 bg-white/90 backdrop-blur-md px-5 py-2.5 rounded-xl border border-white shadow-sm transition-all hover:shadow-md">
          &larr; Volver al inicio
        </button>
        
        <!-- BANNER DEL CURSO (Rojo Institucional) -->
        <div class="bg-institucional-900 rounded-3xl p-8 mb-8 text-white flex items-center gap-6 shadow-xl relative overflow-hidden border border-institucional-800">
          
          <!-- Elementos decorativos del banner -->
          <div class="absolute top-0 right-0 w-64 h-64 bg-white opacity-5 rounded-full blur-3xl -mr-20 -mt-20"></div>
          
          <div class="w-20 h-20 rounded-2xl bg-white/10 text-white flex items-center justify-center font-black text-3xl border border-white/20 shadow-inner backdrop-blur-sm z-10" id="curso-icono"></div>
          
          <div class="z-10 w-full">
            <div class="flex justify-between items-start">
              <div>
                <h1 class="text-3xl sm:text-4xl font-black mb-2 tracking-tight drop-shadow-md" id="curso-titulo"></h1>
                <p class="text-white/80 font-medium flex items-center gap-2 text-sm">
                  <span class="w-2 h-2 rounded-full bg-green-400 shadow-[0_0_8px_rgba(74,222,128,0.8)]"></span>
                  <span id="curso-profesor"></span>
                </p>
              </div>
              <div class="text-right hidden sm:block bg-black/20 px-5 py-3 rounded-2xl border border-white/10 backdrop-blur-md">
                <span class="text-xs font-bold text-white/70 uppercase tracking-wider block mb-1">Progreso</span>
                <p class="text-3xl font-black text-white drop-shadow-md" id="curso-progreso-texto">0%</p>
              </div>
            </div>
            
            <div class="w-full bg-black/30 rounded-full h-3 mt-6 border border-white/10 overflow-hidden shadow-inner">
              <div id="curso-progreso-barra" class="bg-white h-full rounded-full transition-all duration-700 relative shadow-[0_0_10px_rgba(255,255,255,0.5)]"></div>
            </div>
          </div>
        </div>

        <!-- BOTONES DE NAVEGACIÓN -->
        <div class="grid grid-cols-3 gap-4 sm:gap-6 mb-8">
          
          <!-- Botón Apuntes -->
          <!-- 📌 INSTRUCCIÓN PARA TI: Guarda el ícono de apuntes en 'images' como 'icono-apuntes.png' -->
          <button onclick="cargarContenido('documentos')" class="bg-white/95 backdrop-blur-sm rounded-3xl border border-white shadow-lg hover:shadow-xl hover:border-institucional-900/30 transform hover:-translate-y-1 transition-all flex flex-col items-center justify-center p-6 sm:py-8 group">
            <div class="h-16 mb-4 transform group-hover:scale-110 transition-transform">
               <img src="images/icono-apuntes.png" alt="Apuntes" class="h-full object-contain drop-shadow-md">
            </div>
            <span class="font-bold text-sm sm:text-base text-slate-700 group-hover:text-institucional-900">Apuntes</span>
          </button>
          
          <!-- Botón Guías -->
          <!-- 📌 INSTRUCCIÓN PARA TI: Guarda el ícono de guías en 'images' como 'icono-guias.png' -->
          <button onclick="cargarContenido('ejercicios')" class="bg-white/95 backdrop-blur-sm rounded-3xl border border-white shadow-lg hover:shadow-xl hover:border-institucional-900/30 transform hover:-translate-y-1 transition-all flex flex-col items-center justify-center p-6 sm:py-8 group">
            <div class="h-16 mb-4 transform group-hover:scale-110 transition-transform">
               <img src="images/icono-guias.png" alt="Guías" class="h-full object-contain drop-shadow-md">
            </div>
            <span class="font-bold text-sm sm:text-base text-slate-700 group-hover:text-institucional-900">Guías</span>
          </button>
          
          <!-- Botón Clase Viva -->
          <!-- 📌 INSTRUCCIÓN PARA TI: Guarda el ícono de video en 'images' como 'icono-clase.png' -->
          <button onclick="cargarContenido('clases')" class="bg-white/95 backdrop-blur-sm rounded-3xl border border-white shadow-lg hover:shadow-xl hover:border-institucional-900/30 transform hover:-translate-y-1 transition-all flex flex-col items-center justify-center p-6 sm:py-8 group">
            <div class="h-16 mb-4 transform group-hover:scale-110 transition-transform relative">
               <div class="absolute -top-1 -right-1 flex h-3 w-3 z-10"><span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-red-400 opacity-75"></span><span class="relative inline-flex rounded-full h-3 w-3 bg-red-500 shadow-sm"></span></div>
               <img src="images/icono-clase.png" alt="Clase Viva" class="h-full object-contain drop-shadow-md relative z-0">
            </div>
            <span class="font-bold text-sm sm:text-base text-slate-700 group-hover:text-institucional-900">Clase Viva</span>
          </button>
          
        </div>

        <!-- PANEL DE VISUALIZACIÓN DINÁMICA -->
        <div id="panel-contenido" class="bg-white/95 backdrop-blur-md rounded-3xl border border-white p-6 sm:p-8 shadow-xl hidden animate-fade-in">
          <div class="flex items-center gap-3 mb-6 border-b border-slate-100 pb-4">
             <!-- 📌 INSTRUCCIÓN PARA TI: Guarda un ícono genérico decorativo en 'images' como 'icono-panel.png' (opcional, si no, usa el emoji que dejé como respaldo) -->
             <span class="text-2xl text-institucional-900 drop-shadow-sm">📋</span>
             <h2 id="panel-titulo" class="text-xl font-bold text-slate-800">Selecciona una opción</h2>
          </div>
          <div id="panel-lista" class="space-y-4"></div>
        </div>
      </section>

    </main>
  </div>

  <script>
    // --- LÓGICA DE DATOS (Mantiene tu funcionalidad actual intacta) ---
    const infoCursos = {
      'Matemática M1': { profe: 'Prof. Javier Vargas', icono: 'M1' },
      'Matemática M2': { profe: 'Prof. Javier Vargas', icono: 'M2' },
      'Química': { profe: 'Prof. Ignacio Rojas', icono: 'Q' },
      'Física': { profe: 'Prof. Luis Tapia', icono: 'F' },
      'Biología': { profe: 'Prof. Carmen Paz', icono: 'B' },
      'Comprensión Lectora': { profe: 'Prof. Felipe Díaz', icono: 'CL' }
    };

    let baseDatosMateriales = {};
    let cursoActivo = "";

    document.addEventListener("DOMContentLoaded", () => {
      const nombre = localStorage.getItem('alumnoLogueado');
      const cursosBrutos = localStorage.getItem('alumnoCursos');
      const materialesCrudos = localStorage.getItem('materialesProfesores');
      
      if(!nombre) { window.location.href = "login.html"; return; }

      if (materialesCrudos) {
        try {
          const listaMat = JSON.parse(materialesCrudos);
          listaMat.forEach((item, index) => {
            if (!baseDatosMateriales[item.curso]) {
              baseDatosMateriales[item.curso] = { documentos: [], ejercicios: [], enlaceEnVivo: "" };
            }
            if (item.tipo === 'documento') {
              baseDatosMateriales[item.curso].documentos.push({ id: 'doc_' + index, titulo: item.titulo, url: item.url });
            } else if (item.tipo === 'ejercicio') {
              baseDatosMateriales[item.curso].ejercicios.push({ id: 'ej_' + index, titulo: item.titulo, url: item.url, pts: item.puntos });
            } else if (item.tipo === 'clase') {
              baseDatosMateriales[item.curso].enlaceEnVivo = item.url;
            }
          });
        } catch(e) {}
      }

      document.getElementById('user-name').textContent = nombre;
      const iniciales = nombre.split(' ').map(n => n[0]).join('').substring(0,2).toUpperCase();
      document.querySelectorAll('.user-initials').forEach(el => el.textContent = iniciales);

      const contenedor = document.getElementById('cursos-container');
      let cursosArray = cursosBrutos ? cursosBrutos.split(',').map(c => c.trim()).filter(c => c) : [];

      if(cursosArray.length === 0) {
        contenedor.innerHTML = '<div class="col-span-2 bg-white/80 p-6 rounded-2xl text-slate-600 font-medium text-center border border-slate-200">No tienes cursos registrados en el sistema.</div>';
      } else {
        cursosArray.forEach(curso => {
          const info = infoCursos[curso] || { profe: 'Profesor Asignado', icono: curso.substring(0,2).toUpperCase() };
          let progreso = parseInt(localStorage.getItem(`progreso_${curso}`) || 0);

          const tarjeta = document.createElement('button');
          tarjeta.className = "text-left bg-white/95 backdrop-blur-md rounded-3xl border border-white shadow-lg hover:shadow-xl hover:border-institucional-900/30 transform hover:-translate-y-1.5 transition-all duration-300 p-8 group w-full relative overflow-hidden";
          tarjeta.onclick = () => abrirCurso(curso, info.profe, info.icono);
          tarjeta.innerHTML = `
            <div class="absolute top-0 right-0 w-32 h-32 bg-institucional-900/5 rounded-full blur-2xl -mr-10 -mt-10 group-hover:bg-institucional-900/10 transition-colors"></div>
            <div class="flex justify-between mb-6 relative z-10">
              <div class="w-16 h-16 rounded-2xl bg-slate-100 text-institucional-900 flex items-center justify-center font-black text-3xl group-hover:bg-institucional-900 group-hover:text-white transition-all shadow-inner border border-slate-200">${info.icono}</div>
              <span class="bg-emerald-100 text-emerald-700 border border-emerald-200 text-xs font-bold px-3 py-1.5 rounded-lg h-fit shadow-sm">En curso</span>
            </div>
            <h3 class="font-bold text-2xl mb-2 text-slate-800 group-hover:text-institucional-900 transition-colors relative z-10 tracking-tight">${curso}</h3>
            <p class="text-sm text-slate-500 font-medium mb-6 relative z-10">${info.profe}</p>
            
            <div class="w-full bg-slate-100 rounded-full h-3 relative z-10 border border-slate-200 overflow-hidden shadow-inner">
              <div class="bg-institucional-900 h-full rounded-full transition-all duration-700 relative" style="width:${progreso}%"></div>
            </div>
            <div class="text-right mt-3 relative z-10"><span class="text-xs font-bold text-slate-400 uppercase tracking-wider">Progreso: ${progreso}%</span></div>
          `;
          contenedor.appendChild(tarjeta);
        });
      }
    });

    function abrirCurso(nombre, profe, icono) {
      cursoActivo = nombre;
      document.getElementById('curso-titulo').textContent = nombre;
      document.getElementById('curso-icono').textContent = icono;
      document.getElementById('curso-profesor').textContent = profe;
      
      actualizarBarraInterior();

      document.getElementById('panel-contenido').classList.add('hidden'); 
      document.getElementById('vista-cursos').classList.add('hidden');
      document.getElementById('vista-curso').classList.remove('hidden');
      document.getElementById('vista-curso').classList.add('animate-fade-in');
      window.scrollTo(0,0);
    }

    function actualizarBarraInterior() {
      let progreso = parseInt(localStorage.getItem(`progreso_${cursoActivo}`) || 0);
      document.getElementById('curso-progreso-texto').textContent = `${progreso}%`;
      document.getElementById('curso-progreso-barra').style.width = `${progreso}%`;
    }

    function volverCursos() { location.reload(); }

    function cargarContenido(tipo) {
      const panel = document.getElementById('panel-contenido');
      const tituloPanel = document.getElementById('panel-titulo');
      const listaPanel = document.getElementById('panel-lista');
      
      panel.classList.remove('hidden');
      listaPanel.innerHTML = '';

      const infoMaterial = baseDatosMateriales[cursoActivo];

      if (!infoMaterial || (tipo === 'documentos' && infoMaterial.documentos.length === 0) || (tipo === 'ejercicios' && infoMaterial.ejercicios.length === 0) || (tipo === 'clases' && !infoMaterial.enlaceEnVivo)) {
        tituloPanel.textContent = "Sin material disponible";
        listaPanel.innerHTML = `
          <div class="bg-slate-50 border border-slate-200 rounded-2xl p-10 text-center">
            <span class="text-5xl block mb-4 opacity-30 grayscale">📂</span>
            <p class="text-slate-500 font-medium text-sm">El profesor aún no ha subido material reciente para esta sección.</p>
          </div>`;
        return;
      }

      if (tipo === 'documentos') {
        tituloPanel.textContent = "Apuntes de Clase";
        
        infoMaterial.documentos.forEach(doc => {
          
          if (doc.titulo.startsWith('----')) {
             listaPanel.innerHTML += `
               <div class="mt-6 mb-3 border-b border-institucional-900/20 pb-2">
                 <span class="text-xs font-bold text-institucional-900 uppercase tracking-widest">${doc.titulo.replace(/-/g, '').trim()}</span>
               </div>
             `;
          } else {
             listaPanel.innerHTML += `
               <a href="${doc.url}" target="_blank" class="flex items-center gap-4 p-4 rounded-2xl border border-slate-200 hover:border-institucional-900/30 hover:shadow-md hover:bg-slate-50 transition-all group">
                 <div class="w-12 h-12 rounded-xl bg-slate-100 flex items-center justify-center text-2xl group-hover:bg-institucional-900 group-hover:text-white transition-colors shadow-sm">📄</div>
                 <div class="flex-1 font-bold text-slate-700 text-sm group-hover:text-institucional-900">${doc.titulo}</div>
                 <div class="text-xs text-slate-500 bg-white px-4 py-2 rounded-xl font-bold border border-slate-200 shadow-sm group-hover:bg-institucional-900 group-hover:text-white group-hover:border-institucional-900 transition-colors uppercase tracking-wider">Ver</div>
               </a>`;
          }
        });

      } else if (tipo === 'ejercicios') {
        tituloPanel.textContent = "Guías de Ejercitación";
        infoMaterial.ejercicios.forEach(ej => {
          const completado = localStorage.getItem(`ej_${cursoActivo}_${ej.id}`) === 'true';
          const btnClase = completado ? "bg-slate-50 border-slate-200 opacity-70" : "bg-white border-slate-200 hover:border-institucional-900/30 hover:shadow-md";
          
          listaPanel.innerHTML += `
            <div class="flex flex-col sm:flex-row sm:items-center justify-between p-5 rounded-2xl border ${btnClase} transition-all gap-4">
              <div class="flex items-center gap-4 flex-1">
                <!-- 📌 INSTRUCCIÓN PARA TI: Puedes guardar un ícono de lápiz o usar el emoji -->
                <div class="w-10 h-10 flex items-center justify-center text-2xl drop-shadow-sm">
                  ${completado ? '✅' : '✏️'}
                </div>
                <a href="${ej.url}" target="_blank" class="font-bold text-sm text-slate-700 hover:text-institucional-900 transition-colors">${ej.titulo}</a>
              </div>
              <div class="flex items-center justify-between sm:justify-end gap-5 border-t sm:border-t-0 pt-4 sm:pt-0 border-slate-100">
                <span class="text-xs font-bold text-slate-400 bg-slate-100 px-3 py-1.5 rounded-lg border border-slate-200">${ej.pts} pts</span>
                ${!completado ? `<button onclick="marcarEjercicioHecho('${ej.id}',${ej.pts})" class="text-xs font-bold bg-institucional-900 text-white px-5 py-2.5 rounded-xl hover:bg-institucional-800 shadow-md transition-colors hover:shadow-lg active:scale-95 uppercase tracking-wider">Marcar Listo</button>` 
                              : `<span class="text-xs font-bold text-emerald-700 bg-emerald-100 px-4 py-2 rounded-xl border border-emerald-200 flex items-center gap-2"><span class="w-2 h-2 rounded-full bg-emerald-500 shadow-sm"></span> Completado</span>`}
              </div>
            </div>`;
        });

      } else if (tipo === 'clases') {
        tituloPanel.textContent = "Sala de Clases en Vivo";
        if (infoMaterial.enlaceEnVivo && infoMaterial.enlaceEnVivo !== "") {
          listaPanel.innerHTML = `
            <div class="bg-institucional-900/5 border border-institucional-900/10 p-10 rounded-3xl text-center relative overflow-hidden">
              <!-- 📌 INSTRUCCIÓN PARA TI: Puedes usar un ícono de cámara web aquí si lo guardas en 'images' -->
              <div class="w-20 h-20 bg-white rounded-2xl shadow-md flex items-center justify-center text-4xl mx-auto mb-6 border border-slate-200">📡</div>
              <h3 class="text-xl font-black text-institucional-900 mb-3 tracking-tight">Sala Virtual Activa</h3>
              <p class="text-sm text-slate-600 font-medium mb-8 max-w-sm mx-auto">El profesor ya está en la sala. Asegúrate de tener tu micrófono silenciado al entrar.</p>
              <a href="${infoMaterial.enlaceEnVivo}" target="_blank" class="inline-flex items-center justify-center gap-3 bg-institucional-900 hover:bg-institucional-800 text-white font-bold py-4 px-10 rounded-2xl shadow-xl transition-all transform hover:-translate-y-1 hover:shadow-institucional-900/40 uppercase tracking-wider w-full sm:w-auto">
                <span>Ingresar a la clase</span>
              </a>
            </div>`;
        }
      }
    }

    function marcarEjercicioHecho(ejercicioId, puntos) {
      localStorage.setItem(`ej_${cursoActivo}_${ejercicioId}`, 'true');
      
      let progresoActual = parseInt(localStorage.getItem(`progreso_${cursoActivo}`) || 0);
      progresoActual += parseInt(puntos) || 0;
      if(progresoActual > 100) progresoActual = 100;
      localStorage.setItem(`progreso_${cursoActivo}`, progresoActual);

      actualizarBarraInterior();
      cargarContenido('ejercicios'); 
    }

    function cerrarSesion() {
      localStorage.clear();
      window.location.href = "login.html";
    }
  </script>
</body>
</html>
