<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aula Virtual — Preu CP</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: { extend: { colors: { institucional: { 900: '#0F172A' }, acento: { DEFAULT: '#1D4ED8' } }, animation: { 'fade-in': 'fadeIn 0.3s ease-in-out' }, keyframes: { fadeIn: { '0%': { opacity: '0', transform: 'translateY(10px)' }, '100%': { opacity: '1', transform: 'translateY(0)' } } } } }
  }
</script>
</head>
<body class="bg-slate-50 text-slate-900 antialiased font-sans">

  <!-- NAVBAR -->
  <header class="bg-institucional-900 sticky top-0 z-40 shadow-md">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 flex items-center justify-between h-16">
      <div class="flex items-center gap-3">
        <div class="w-8 h-8 rounded-lg bg-acento flex items-center justify-center text-white font-bold text-sm">CP</div>
        <span class="text-white font-semibold hidden sm:block">Aula Virtual</span>
      </div>
      <div class="w-9 h-9 rounded-full bg-slate-700 border-2 border-slate-600 flex items-center justify-center text-white text-sm font-bold cursor-pointer user-initials">--</div>
    </div>
  </header>

  <div class="max-w-7xl mx-auto px-4 sm:px-6 py-8 flex flex-col lg:flex-row gap-8">
    
    <!-- SIDEBAR -->
    <aside class="w-full lg:w-64 shrink-0">
      <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 sticky top-24">
        <div class="text-center mb-6">
          <div class="w-20 h-20 mx-auto rounded-full bg-gradient-to-tr from-acento to-blue-400 p-1 mb-3">
            <div class="w-full h-full bg-white rounded-full flex items-center justify-center text-2xl font-bold text-slate-700 user-initials">--</div>
          </div>
          <h2 class="font-bold text-lg" id="user-name">Cargando...</h2>
          <p class="text-sm text-acento font-medium">Generación 2026</p>
        </div>
        <button onclick="cerrarSesion()" class="w-full text-center text-sm text-red-500 hover:bg-red-50 py-2 rounded-xl font-bold transition-colors">Cerrar Sesión</button>
      </div>
    </aside>

    <!-- MAIN AREA -->
    <main class="flex-1 min-w-0">
      
      <!-- VISTA 1: LISTA DE CURSOS DINÁMICA -->
      <section id="vista-cursos" class="animate-fade-in">
        <div class="mb-6">
          <h1 class="text-2xl sm:text-3xl font-bold text-slate-800">Mis cursos activos</h1>
          <p class="text-sm text-slate-500 mt-1">Tus módulos inscritos según registro.</p>
        </div>
        
        <!-- Aquí se inyectarán las tarjetas desde Javascript -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4" id="cursos-container">
        </div>
      </section>

      <!-- VISTA 2: INTERIOR DEL CURSO -->
      <section id="vista-curso" class="hidden">
        <button onclick="volverCursos()" class="text-sm font-semibold text-slate-500 hover:text-acento mb-6 flex items-center gap-2 bg-white px-4 py-2 rounded-lg border border-slate-200 shadow-sm transition-colors">
          &larr; Volver a Mis cursos
        </button>
        
        <div class="bg-institucional-900 rounded-2xl p-6 sm:p-8 mb-8 text-white flex items-center gap-5 shadow-lg relative overflow-hidden">
          <div class="w-16 h-16 rounded-2xl bg-white/20 text-white flex items-center justify-center font-black text-2xl border border-white/30" id="curso-icono"></div>
          <div class="z-10">
            <h1 class="text-2xl sm:text-3xl font-bold mb-1" id="curso-titulo"></h1>
            <p class="text-blue-200 font-medium" id="curso-profesor"></p>
          </div>
        </div>

        <div class="grid grid-cols-2 sm:grid-cols-4 gap-4 sm:gap-6">
          <button onclick="completarTarea('Documentos', 15)" class="aspect-square bg-white rounded-2xl border border-slate-200 shadow-sm hover:border-blue-300 transform hover:-translate-y-1 transition-all flex flex-col items-center justify-center gap-4 group">
            <div class="w-14 h-14 rounded-full bg-slate-50 flex items-center justify-center text-2xl group-hover:bg-blue-50">📄</div>
            <span class="font-bold text-sm text-slate-700">Documentos</span>
          </button>
          <button onclick="completarTarea('Ejercicios', 20)" class="aspect-square bg-white rounded-2xl border border-slate-200 shadow-sm hover:border-blue-300 transform hover:-translate-y-1 transition-all flex flex-col items-center justify-center gap-4 group">
            <div class="w-14 h-14 rounded-full bg-slate-50 flex items-center justify-center text-2xl group-hover:bg-blue-50">✏️</div>
            <span class="font-bold text-sm text-slate-700">Ejercicios</span>
          </button>
          <button onclick="completarTarea('Clase en Vivo', 10)" class="aspect-square bg-white rounded-2xl border border-blue-200 shadow-md hover:border-blue-400 transform hover:-translate-y-1 transition-all flex flex-col items-center justify-center gap-4 group bg-blue-50">
            <div class="w-14 h-14 rounded-full bg-acento text-white flex items-center justify-center text-2xl">🎥</div>
            <span class="font-bold text-sm text-acento">Clase en Vivo</span>
          </button>
        </div>
      </section>

    </main>
  </div>

  <script>
    // Configuración base de tus cursos
    const infoCursos = {
      'Matemática M1': { profe: 'Prof. Andrea Muñoz', icono: 'M1' },
      'Matemática M2': { profe: 'Prof. Andrea Muñoz', icono: 'M2' },
      'Química': { profe: 'Prof. Ignacio Rojas', icono: 'Q' },
      'Física': { profe: 'Prof. Luis Tapia', icono: 'F' },
      'Biología': { profe: 'Prof. Carmen Paz', icono: 'B' },
      'Comprensión Lectora': { profe: 'Prof. Felipe Díaz', icono: 'CL' }
    };

    let cursoActivo = "";

    document.addEventListener("DOMContentLoaded", () => {
      const nombre = localStorage.getItem('alumnoLogueado');
      const cursosBrutos = localStorage.getItem('alumnoCursos');
      
      // Seguridad: Si entra sin login, lo devuelve al index
      if(!nombre) { window.location.href = "login.html"; return; }

      // 1. Mostrar nombre y generar iniciales
      document.getElementById('user-name').textContent = nombre;
      const iniciales = nombre.split(' ').map(n => n[0]).join('').substring(0,2).toUpperCase();
      document.querySelectorAll('.user-initials').forEach(el => el.textContent = iniciales);

      // 2. Mostrar Tarjetas de Cursos
      const contenedor = document.getElementById('cursos-container');
      
      // Limpiamos los cursos que llegan del Excel (ej: "Matemática M1, Química")
      let cursosArray = [];
      if(cursosBrutos) {
        cursosArray = cursosBrutos.split(',').map(c => c.trim()).filter(c => c);
      }

      if(cursosArray.length === 0) {
        contenedor.innerHTML = '<p class="text-slate-500 col-span-2">No tienes cursos registrados en el sistema.</p>';
      } else {
        cursosArray.forEach(curso => {
          // Buscamos la info del curso o creamos una genérica si no existe en la lista
          const info = infoCursos[curso] || { profe: 'Profesor Asignado', icono: curso.substring(0,2).toUpperCase() };
          
          // Leemos el progreso guardado
          let progreso = parseInt(localStorage.getItem(`progreso_${curso}`) || 0);

          const tarjeta = document.createElement('button');
          tarjeta.className = "text-left bg-white rounded-2xl border border-slate-200 shadow-sm hover:shadow-md hover:border-blue-300 transform hover:-translate-y-1 transition-all duration-200 p-5 group";
          tarjeta.onclick = () => abrirCurso(curso, info.profe, info.icono);
          tarjeta.innerHTML = `
            <div class="flex justify-between mb-4">
              <div class="w-12 h-12 rounded-xl bg-blue-100 text-acento flex items-center justify-center font-black text-xl group-hover:bg-acento group-hover:text-white transition-colors">${info.icono}</div>
              <span class="bg-green-100 text-green-700 text-xs font-bold px-2.5 py-1 rounded-md">En curso</span>
            </div>
            <h3 class="font-bold text-lg mb-1">${curso}</h3>
            <p class="text-sm text-slate-500 font-medium mb-4">${info.profe}</p>
            <div class="w-full bg-slate-100 rounded-full h-2">
              <div class="bg-acento h-2 rounded-full transition-all duration-500" style="width:${progreso}%"></div>
            </div>
            <div class="text-right mt-2"><span class="text-xs font-bold text-slate-400">Progreso: ${progreso}%</span></div>
          `;
          contenedor.appendChild(tarjeta);
        });
      }
    });

    // Función para entrar al curso
    function abrirCurso(nombre, profe, icono) {
      cursoActivo = nombre;
      document.getElementById('curso-titulo').textContent = nombre;
      document.getElementById('curso-icono').textContent = icono;
      document.getElementById('curso-profesor').textContent = profe;
      
      document.getElementById('vista-cursos').classList.add('hidden');
      document.getElementById('vista-curso').classList.remove('hidden');
      document.getElementById('vista-curso').classList.add('animate-fade-in');
    }

    // Función para volver y actualizar barras
    function volverCursos() { 
      location.reload(); 
    }

    // Función que simula el avance y crecimiento de barra
    function completarTarea(tipo, porcentajeAumento) {
      let progresoActual = parseInt(localStorage.getItem(`progreso_${cursoActivo}`) || 0);
      
      if (progresoActual < 100) {
        progresoActual += porcentajeAumento; 
        if(progresoActual > 100) progresoActual = 100; // Tope máximo 100%
        
        localStorage.setItem(`progreso_${cursoActivo}`, progresoActual);
        alert(`📚 Abriste: ${tipo}. \n¡Excelente, tu progreso en ${cursoActivo} ha aumentado a ${progresoActual}%!`);
      } else {
        alert(`¡Felicidades! Ya completaste el 100% de los recursos en ${cursoActivo}.`);
      }
    }

    function cerrarSesion() {
      localStorage.clear();
      window.location.href = "login.html";
    }
  </script>
</body>
</html>
