<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aula Virtual — Preu CP</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: { extend: { colors: { institucional: { 900: '#0F172A' }, acento: { DEFAULT: '#1D4ED8' } }, animation: { 'fade-in': 'fadeIn 0.3s ease-in-out' }, keyframes: { fadeIn: { '0%': { opacity: '0', transform: 'translateY(10px)' }, '100%': { opacity: '1', transform: 'translateY(0)' } } } } }
  }
</script>
</head>
<body class="bg-slate-50 text-slate-900 antialiased font-sans">

  <!-- NAVBAR -->
  <header class="bg-institucional-900 sticky top-0 z-40 shadow-md">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 flex items-center justify-between h-16">
      <div class="flex items-center gap-3">
        <div class="w-8 h-8 rounded-lg bg-acento flex items-center justify-center text-white font-bold text-sm">CP</div>
        <span class="text-white font-semibold hidden sm:block">Aula Virtual</span>
      </div>
      <div class="w-9 h-9 rounded-full bg-slate-700 border-2 border-slate-600 flex items-center justify-center text-white text-sm font-bold cursor-pointer user-initials">--</div>
    </div>
  </header>

  <div class="max-w-7xl mx-auto px-4 sm:px-6 py-8 flex flex-col lg:flex-row gap-8">
    
    <!-- SIDEBAR -->
    <aside class="w-full lg:w-64 shrink-0">
      <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 sticky top-24">
        <div class="text-center mb-6">
          <div class="w-20 h-20 mx-auto rounded-full bg-gradient-to-tr from-acento to-blue-400 p-1 mb-3">
            <div class="w-full h-full bg-white rounded-full flex items-center justify-center text-2xl font-bold text-slate-700 user-initials">--</div>
          </div>
          <h2 class="font-bold text-lg" id="user-name">Cargando...</h2>
          <p class="text-sm text-acento font-medium">Generación 2026</p>
        </div>
        <button onclick="cerrarSesion()" class="w-full text-center text-sm text-red-500 hover:bg-red-50 py-2 rounded-xl font-bold transition-colors">Cerrar Sesión</button>
      </div>
    </aside>

    <!-- MAIN AREA -->
    <main class="flex-1 min-w-0">
      
      <!-- VISTA 1: LISTA DE CURSOS DINÁMICA -->
      <section id="vista-cursos" class="animate-fade-in">
        <div class="mb-6">
          <h1 class="text-2xl sm:text-3xl font-bold text-slate-800">Mis cursos activos</h1>
          <p class="text-sm text-slate-500 mt-1">Tus módulos inscritos según registro.</p>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4" id="cursos-container"></div>
      </section>

      <!-- VISTA 2: INTERIOR DEL CURSO -->
      <section id="vista-curso" class="hidden">
        <button onclick="volverCursos()" class="text-sm font-semibold text-slate-500 hover:text-acento mb-6 flex items-center gap-2 bg-white px-4 py-2 rounded-lg border border-slate-200 shadow-sm transition-colors">
          &larr; Volver a Mis cursos
        </button>
        
        <div class="bg-institucional-900 rounded-2xl p-6 sm:p-8 mb-8 text-white flex items-center gap-5 shadow-lg relative overflow-hidden">
          <div class="w-16 h-16 rounded-2xl bg-white/20 text-white flex items-center justify-center font-black text-2xl border border-white/30" id="curso-icono"></div>
          <div class="z-10 w-full">
            <div class="flex justify-between items-start">
              <div>
                <h1 class="text-2xl sm:text-3xl font-bold mb-1" id="curso-titulo"></h1>
                <p class="text-blue-200 font-medium" id="curso-profesor"></p>
              </div>
              <div class="text-right hidden sm:block">
                <span class="text-sm font-bold text-blue-200">Progreso actual</span>
                <p class="text-2xl font-black" id="curso-progreso-texto">0%</p>
              </div>
            </div>
            <!-- Barra de progreso interior -->
            <div class="w-full bg-slate-700/50 rounded-full h-2 mt-4">
              <div id="curso-progreso-barra" class="bg-blue-400 h-2 rounded-full transition-all duration-500" style="width:0%"></div>
            </div>
          </div>
        </div>

        <!-- Botones de Navegación del Curso -->
        <div class="grid grid-cols-3 sm:grid-cols-3 gap-3 sm:gap-6 mb-8">
          <button onclick="cargarContenido('documentos')" class="aspect-square sm:aspect-auto sm:h-32 bg-white rounded-2xl border border-slate-200 shadow-sm hover:border-blue-300 transform hover:-translate-y-1 transition-all flex flex-col items-center justify-center gap-2 sm:gap-4 group focus:ring-2 focus:ring-acento">
            <div class="w-12 h-12 sm:w-14 sm:h-14 rounded-full bg-slate-50 flex items-center justify-center text-xl sm:text-2xl group-hover:bg-blue-50">📄</div>
            <span class="font-bold text-xs sm:text-sm text-slate-700">Documentos</span>
          </button>
          <button onclick="cargarContenido('ejercicios')" class="aspect-square sm:aspect-auto sm:h-32 bg-white rounded-2xl border border-slate-200 shadow-sm hover:border-blue-300 transform hover:-translate-y-1 transition-all flex flex-col items-center justify-center gap-2 sm:gap-4 group focus:ring-2 focus:ring-acento">
            <div class="w-12 h-12 sm:w-14 sm:h-14 rounded-full bg-slate-50 flex items-center justify-center text-xl sm:text-2xl group-hover:bg-blue-50">✏️</div>
            <span class="font-bold text-xs sm:text-sm text-slate-700">Ejercicios</span>
          </button>
          <button onclick="cargarContenido('clases')" class="aspect-square sm:aspect-auto sm:h-32 bg-white rounded-2xl border border-blue-200 shadow-md hover:border-blue-400 transform hover:-translate-y-1 transition-all flex flex-col items-center justify-center gap-2 sm:gap-4 group bg-blue-50 focus:ring-2 focus:ring-acento relative overflow-hidden">
            <div class="absolute top-2 right-2 flex h-3 w-3"><span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-red-400 opacity-75"></span><span class="relative inline-flex rounded-full h-3 w-3 bg-red-500"></span></div>
            <div class="w-12 h-12 sm:w-14 sm:h-14 rounded-full bg-acento text-white flex items-center justify-center text-xl sm:text-2xl">🎥</div>
            <span class="font-bold text-xs sm:text-sm text-acento text-center">Clase en Vivo</span>
          </button>
        </div>

        <!-- PANEL DE VISUALIZACIÓN DINÁMICA -->
        <div id="panel-contenido" class="bg-white rounded-2xl border border-slate-200 p-6 shadow-sm hidden animate-fade-in">
          <h2 id="panel-titulo" class="text-xl font-bold text-slate-800 mb-4 border-b pb-2">Selecciona una opción</h2>
          <div id="panel-lista" class="space-y-3">
            <!-- Aquí se inyectan los PDFs, Guías o Links -->
          </div>
        </div>

      </section>

    </main>
  </div>

  <script>
    // Configuración base de profesores
    const infoCursos = {
      'Matemática M1': { profe: 'Prof. Andrea Muñoz', icono: 'M1' },
      'Matemática M2': { profe: 'Prof. Andrea Muñoz', icono: 'M2' },
      'Química': { profe: 'Prof. Ignacio Rojas', icono: 'Q' },
      'Física': { profe: 'Prof. Luis Tapia', icono: 'F' },
      'Biología': { profe: 'Prof. Carmen Paz', icono: 'B' },
      'Comprensión Lectora': { profe: 'Prof. Felipe Díaz', icono: 'CL' }
    };

    // SIMULACIÓN DE BASE DE DATOS DE MATERIALES (Próximamente vendrá del Excel)
    const baseDatosMateriales = {
      'Matemática M1': {
        documentos: [
          { id: 'doc1', titulo: 'Syllabus y Reglas del Curso', url: '#' },
          { id: 'doc2', titulo: 'Resumen Fórmulas Álgebra', url: '#' }
        ],
        ejercicios: [
          { id: 'ej1', titulo: 'Guía 1: Números y Proporciones', pts: 25 },
          { id: 'ej2', titulo: 'Guía 2: Álgebra básica', pts: 25 },
          { id: 'ej3', titulo: 'Guía 3: Funciones', pts: 25 },
          { id: 'ej4', titulo: 'Ensayo Parcial', pts: 25 }
        ],
        enlaceEnVivo: 'https://zoom.us/j/ejemplo123' // Si está vacío "", dirá que no hay clase activa
      }
    };

    let cursoActivo = "";

    document.addEventListener("DOMContentLoaded", () => {
      const nombre = localStorage.getItem('alumnoLogueado');
      const cursosBrutos = localStorage.getItem('alumnoCursos');
      
      if(!nombre) { window.location.href = "login.html"; return; }

      document.getElementById('user-name').textContent = nombre;
      const iniciales = nombre.split(' ').map(n => n[0]).join('').substring(0,2).toUpperCase();
      document.querySelectorAll('.user-initials').forEach(el => el.textContent = iniciales);

      const contenedor = document.getElementById('cursos-container');
      let cursosArray = cursosBrutos ? cursosBrutos.split(',').map(c => c.trim()).filter(c => c) : [];

      if(cursosArray.length === 0) {
        contenedor.innerHTML = '<p class="text-slate-500 col-span-2">No tienes cursos registrados en el sistema.</p>';
      } else {
        cursosArray.forEach(curso => {
          const info = infoCursos[curso] || { profe: 'Profesor Asignado', icono: curso.substring(0,2).toUpperCase() };
          let progreso = parseInt(localStorage.getItem(`progreso_${curso}`) || 0);

          const tarjeta = document.createElement('button');
          tarjeta.className = "text-left bg-white rounded-2xl border border-slate-200 shadow-sm hover:shadow-md hover:border-blue-300 transform hover:-translate-y-1 transition-all duration-200 p-5 group w-full";
          tarjeta.onclick = () => abrirCurso(curso, info.profe, info.icono);
          tarjeta.innerHTML = `
            <div class="flex justify-between mb-4">
              <div class="w-12 h-12 rounded-xl bg-blue-100 text-acento flex items-center justify-center font-black text-xl group-hover:bg-acento group-hover:text-white transition-colors">${info.icono}</div>
              <span class="bg-green-100 text-green-700 text-xs font-bold px-2.5 py-1 rounded-md">En curso</span>
            </div>
            <h3 class="font-bold text-lg mb-1">${curso}</h3>
            <p class="text-sm text-slate-500 font-medium mb-4">${info.profe}</p>
            <div class="w-full bg-slate-100 rounded-full h-2">
              <div class="bg-acento h-2 rounded-full transition-all duration-500" style="width:${progreso}%"></div>
            </div>
            <div class="text-right mt-2"><span class="text-xs font-bold text-slate-400">Progreso: ${progreso}%</span></div>
          `;
          contenedor.appendChild(tarjeta);
        });
      }
    });

    function abrirCurso(nombre, profe, icono) {
      cursoActivo = nombre;
      document.getElementById('curso-titulo').textContent = nombre;
      document.getElementById('curso-icono').textContent = icono;
      document.getElementById('curso-profesor').textContent = profe;
      
      actualizarBarraInterior();

      document.getElementById('panel-contenido').classList.add('hidden'); // Ocultar panel interior
      document.getElementById('vista-cursos').classList.add('hidden');
      document.getElementById('vista-curso').classList.remove('hidden');
      document.getElementById('vista-curso').classList.add('animate-fade-in');
    }

    function actualizarBarraInterior() {
      let progreso = parseInt(localStorage.getItem(`progreso_${cursoActivo}`) || 0);
      document.getElementById('curso-progreso-texto').textContent = `${progreso}%`;
      document.getElementById('curso-progreso-barra').style.width = `${progreso}%`;
    }

    function volverCursos() { 
      location.reload(); 
    }

    // EL CEREBRO DEL CONTENIDO (Separa Documentos, Ejercicios y Clases)
    function cargarContenido(tipo) {
      const panel = document.getElementById('panel-contenido');
      const tituloPanel = document.getElementById('panel-titulo');
      const listaPanel = document.getElementById('panel-lista');
      
      panel.classList.remove('hidden');
      listaPanel.innerHTML = ''; // Limpiar lista anterior

      // Buscar si tenemos info de este curso en la "base de datos"
      const infoMaterial = baseDatosMateriales[cursoActivo];

      if (!infoMaterial) {
        tituloPanel.textContent = "Sin material";
        listaPanel.innerHTML = `<p class="text-slate-500 text-sm">El profesor aún no ha subido material para ${cursoActivo}.</p>`;
        return;
      }

      if (tipo === 'documentos') {
        tituloPanel.textContent = "📄 Documentos y Apuntes";
        infoMaterial.documentos.forEach(doc => {
          listaPanel.innerHTML += `
            <a href="${doc.url}" target="_blank" class="flex items-center gap-3 p-3 rounded-lg border hover:bg-slate-50 transition-colors">
              <div class="text-red-500 text-xl">📕</div>
              <div class="flex-1 font-semibold text-slate-700 text-sm">${doc.titulo}</div>
              <div class="text-xs text-slate-400">Ver PDF</div>
            </a>`;
        });

      } else if (tipo === 'ejercicios') {
        tituloPanel.textContent = "✏️ Guías de Ejercitación";
        infoMaterial.ejercicios.forEach(ej => {
          // Verificar si ya está hecho para marcarlo
          const completado = localStorage.getItem(`ej_${cursoActivo}_${ej.id}`) === 'true';
          const btnClase = completado ? "bg-green-100 text-green-700 border-green-200" : "bg-white border-slate-200 text-slate-600 hover:border-acento";
          const icono = completado ? "✅" : "📝";
          
          listaPanel.innerHTML += `
            <div class="flex items-center justify-between p-3 rounded-lg border ${btnClase} transition-all">
              <div class="flex items-center gap-3">
                <div class="text-xl">${icono}</div>
                <div class="font-semibold text-sm">${ej.titulo}</div>
              </div>
              ${!completado ? `<button onclick="marcarEjercicioHecho('${ej.id}', ${ej.pts})" class="text-xs font-bold bg-acento text-white px-3 py-1.5 rounded-lg hover:bg-blue-700 shadow-sm">Completar</button>` 
                            : `<span class="text-xs font-bold">¡Completado!</span>`}
            </div>`;
        });

      } else if (tipo === 'clases') {
        tituloPanel.textContent = "🎥 Sala de Clases en Vivo";
        if (infoMaterial.enlaceEnVivo && infoMaterial.enlaceEnVivo !== "") {
          listaPanel.innerHTML = `
            <div class="bg-blue-50 border border-blue-200 p-5 rounded-xl text-center">
              <p class="text-sm text-slate-600 font-medium mb-4">El profesor ha abierto la sala virtual. Haz clic abajo para unirte vía Zoom o Meet.</p>
              <a href="${infoMaterial.enlaceEnVivo}" target="_blank" class="inline-block bg-acento hover:bg-blue-700 text-white font-bold py-3 px-6 rounded-lg shadow-md transition-all transform hover:-translate-y-1">
                Conectarse a la clase ahora
              </a>
            </div>`;
        } else {
          listaPanel.innerHTML = `
            <div class="bg-slate-50 border border-slate-200 p-5 rounded-xl text-center text-slate-500">
              <p>El profesor no tiene activa una clase en vivo en este momento.</p>
              <p class="text-xs mt-1">Revisa el horario o espera a que el docente comparta el enlace.</p>
            </div>`;
        }
      }
    }

    // EL MOTOR DEL PROGRESO (Solo se activa con los ejercicios)
    function marcarEjercicioHecho(ejercicioId, puntos) {
      // 1. Marcar en la memoria que ese ejercicio específico se hizo
      localStorage.setItem(`ej_${cursoActivo}_${ejercicioId}`, 'true');
      
      // 2. Sumar el progreso general del curso
      let progresoActual = parseInt(localStorage.getItem(`progreso_${cursoActivo}`) || 0);
      progresoActual += puntos;
      if(progresoActual > 100) progresoActual = 100;
      localStorage.setItem(`progreso_${cursoActivo}`, progresoActual);

      // 3. Actualizar la vista automáticamente
      actualizarBarraInterior();
      cargarContenido('ejercicios'); // Recarga la lista de guías para mostrar el ticket ✅
    }

    function cerrarSesion() {
      localStorage.clear();
      window.location.href = "login.html";
    }
  </script>
</body>
</html>
